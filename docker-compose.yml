# The portal on a shared server, behind that server's own nginx. Started by scripts/deploy-droplet.sh, which
# writes the two env files. Nothing is stored here: records, sign-in and documents are all in Google Cloud.
name: portal
services:
  app:
    build: .
    restart: unless-stopped
    env_file: [../.env, ../key.env]
    ports: ["127.0.0.1:3001:3001"]  # only nginx on this server can reach it
    mem_limit: 450m  # a heavy upload restarts the portal instead of starving the other sites
