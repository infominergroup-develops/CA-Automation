# The CA portal, next to the server's other sites. Written by scripts/deploy-droplet.sh (DOMAIN is replaced).
server {
    listen 80;
    listen [::]:80;
    server_name DOMAIN;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}
# --- https, once the certificate exists ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name DOMAIN;
    ssl_certificate /etc/letsencrypt/live/DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/DOMAIN/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 0;      # no size limit: the portal streams each file to disk and on to the bucket
    proxy_request_buffering off; # straight through to the portal, not first copied to this server's disk
    # A header of its own also stops nginx adding the server-wide ones on top of the app's own security headers.
    add_header X-Robots-Tag "noindex, nofollow" always;
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;  # the visitor's real address; whatever they claim is dropped
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;  # a large upload is stored before the reply comes
        proxy_send_timeout 3600s;
    }
}
